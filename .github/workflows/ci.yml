name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore

      - run: dotnet format --verify-no-changes --no-restore

      - run: dotnet build --no-restore

      - run: dotnet test tests/EventPulse.UnitTests --no-build

      - run: dotnet test tests/EventPulse.IntegrationTests --no-build
